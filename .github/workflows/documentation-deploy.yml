name: Documentation Website Deploy CI

on:
    push:
        branches:
            - master
        paths:
            - 'documentation/**'
            - '.github/workflows/documentation-deploy.yml'
    # Allows deploying the current state of master from the Actions tab,
    # for instance to retry a failed deploy.
    workflow_dispatch:

permissions:
    contents: write

# Never let two deploys write to gh-pages at the same time; queue them instead.
concurrency:
    group: documentation-deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 'documentation'

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build
              run: |
                  yarn
                  yarn next build
                  touch out/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: documentation/out
